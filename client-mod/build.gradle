plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = '0.1.0'
group = 'gg.savira'
base { archivesName = 'savira-client' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// Optional runtime UI test fixture. Never included in the distributed Savira mod.
sourceSets {
    menuTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('menuTestJar', Jar) {
    dependsOn tasks.named('menuTestClasses')
    from sourceSets.menuTest.output
    archiveClassifier = 'menu-test-dev'
}
tasks.register('remapMenuTest', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('menuTestJar')
    inputFile = tasks.named('menuTestJar').flatMap { it.archiveFile }
    archiveFileName = 'savira-menu-test.jar'
    destinationDirectory = layout.buildDirectory.dir('menu-test')
}
